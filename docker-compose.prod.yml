# VH Team Fighters — produção / CI smoke (Coolify / VPS)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# API/Web não publicam portas no host — o reverse proxy liga-se pela rede Docker.
# Para smoke no CI: acrescentar docker-compose.ci-smoke.yml

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:-vh_team}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vh-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:-vh_team}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://garage:3900}
      ALLOW_INSECURE_S3: ${ALLOW_INSECURE_S3:-true}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-same-origin}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-}
        NEXT_PUBLIC_S3_BUCKET: ${S3_BUCKET:-vh-media}
        INTERNAL_API_URL: http://api:3001
    container_name: vh-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:3001
    expose:
      - "3000"
    depends_on:
      - api
