name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency vuln scan (Trivy HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules,.git
          trivyignores: .trivyignore

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vh
          POSTGRES_PASSWORD: vhsecret
          POSTGRES_DB: vh_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vh:vhsecret@localhost:5432/vh_team?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      INTERNAL_API_URL: http://localhost:3001
      ADMIN_EMAIL: admin@vhteamfighters.pt
      ADMIN_PASSWORD: CiAdminPass12!
      ADMIN_NAME: CI Admin
      ENROLLMENT_NOTIFY_TO: notify@vhteamfighters.pt
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@vhteamfighters.pt
      S3_ENDPOINT: http://localhost:9014
      S3_PUBLIC_URL: http://localhost:9014
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: vh-media
      S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @vh/shared build
      - run: pnpm --filter @vh/database build
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - name: Typecheck API
        run: pnpm --filter @vh/api typecheck
      - name: Typecheck Web
        run: pnpm --filter web exec tsc --noEmit
      - name: Lint Web
        run: pnpm --filter web lint
      - name: Test API
        run: pnpm --filter @vh/api test
      - name: Build API
        run: pnpm --filter @vh/api build
      - name: Build Web
        run: pnpm --filter web build
        env:
          NEXT_STANDALONE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Backup and restore (pg_dump / pg_restore)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          mkdir -p backups
          DUMP="backups/ci-vh.dump"
          PG_URL="${DATABASE_URL%%\?*}"
          pg_dump "$PG_URL" -Fc --no-owner --no-acl -f "$DUMP"
          test -s "$DUMP"
          pg_restore -d "$PG_URL" --clean --if-exists --no-owner --no-acl "$DUMP"
          echo "Backup/restore OK"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t vh-api:ci .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t vh-web:ci .
